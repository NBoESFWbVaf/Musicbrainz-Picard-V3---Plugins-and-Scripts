name = "Display Coverinformation"
description = "Displays the cover art image details (dimensions, file size, file type) below the cover art in the cover art panel."
long_description = """
Displays detailed information about the currently shown cover art directly below the cover art image in the cover art panel:

- Image dimensions (height x width in pixels)
- File size
- File type

The information is updated automatically whenever the selection or the cover art changes.
"""
