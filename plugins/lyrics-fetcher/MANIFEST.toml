long_description = """
Lyrics Fetcher is a plugin for Picard. It uses the public API provided by the
lrclib.net project, which requires no registration or API keys!

The API provides synced lyrics and unsynced ones as a fallback. Synced lyrics
are prioritized.

**Options** (Options → Plugins → Lyrics Fetcher):

- Choose whether lyrics are fetched automatically when albums are
  analyzed or manually via the context menu entry "Fetch lyrics from
  lrclib.net" (right-click on albums or tracks; manual is the default).
- The delay between two requests in a manual fetch can be configured
  (1–10 seconds, default 1 s; 2 s recommended if the log shows many
  503 retries from lrclib.net).
- By default, lyrics written in Asian scripts are not loaded at all; loading
  them anyway can be selected instead. The blocked script groups
  (Chinese/Japanese, Korean, Southeast Asian, Indian) can be toggled
  individually.
- Optionally delete blocked lyrics left over in files when saving.

**Note:** The lrclib project does not utilize MusicBrainz IDs, so the results
may not be as accurate. It is recommended to glimpse over your lyrics when
tagging.
"""