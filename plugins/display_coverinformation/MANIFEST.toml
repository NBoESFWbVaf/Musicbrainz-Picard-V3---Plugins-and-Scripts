source_locale = "de"

[description_i18n]
de = "Zeigt die Bildinformationen (Bildmaße, Dateigröße, Dateityp) unterhalb des Coverbildes in der Cover-Spalte an."

[long_description_i18n]
de = """
Zeigt detaillierte Informationen zum aktuell angezeigten Coverbild direkt unterhalb des Coverbildes in der Cover-Spalte:

- Bildmaße (Höhe x Breite in Pixel)
- Dateigröße
- Dateityp

Die Anzeige wird automatisch aktualisiert, sobald sich die Auswahl oder das Coverbild ändert.
"""