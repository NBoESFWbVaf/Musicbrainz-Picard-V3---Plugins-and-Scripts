long_description = """
Sözler is a lyrics fetcher for Picard. It uses the public API provided by the
lrclib.net project, which requires no registration or API keys!

The API provides synced lyrics and unsynced ones as a fallback. Synced lyrics
are prioritized.

**Options** (Options → Plugins → Picard Sözler):

- Skip lyrics written in Asian scripts. The blocked script groups
  (Chinese/Japanese, Korean, Southeast Asian, Indian) can be toggled
  individually.
- Optionally delete blocked lyrics left over in files when saving.

**Note:** The lrclib project does not utilize MusicBrainz IDs, so the results
may not be as accurate. It is recommended to glimpse over your lyrics when
tagging.
"""